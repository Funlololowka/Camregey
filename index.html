<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Камера и музыка</title>
<style>
:root{--bg:#fff;--fg:#1a1a1f;--ac:#7c3aed;--mu:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121218;--fg:#f3f3f7;--mu:#9ca3af}}
:root[data-theme="dark"]{--bg:#121218;--fg:#f3f3f7;--mu:#9ca3af}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px;text-align:center}
.box{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:3/4;border:4px solid var(--mu);transition:border-color .2s}
.box.on{border-color:var(--ac);box-shadow:0 0 30px var(--ac)}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#st{margin:14px 0;font-size:20px;font-weight:600}
button{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px 26px;font-size:17px;cursor:pointer}
p{color:var(--mu);font-size:14px}
</style></head><body><main>

<script>
const v=document.getElementById('v'),a=document.getElementById('a'),st=document.getElementById('st'),box=document.getElementById('box'),m=document.getElementById('m'),b=document.getElementById('b');
let fd=null,lastSeen=0,playing=false;
const c=document.createElement('canvas'),W=64,H=48;c.width=W;c.height=H;
const cx=c.getContext('2d',{willReadFrequently:true});
function skin(){
  cx.drawImage(v,0,0,W,H);const d=cx.getImageData(0,0,W,H).data;let n=0;
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],bl=d[i+2];
    const cb=128-.168736*r-.331264*g+.5*bl, cr=128+.5*r-.418688*g-.081312*bl;

}
async function tick(){

  const now=Date.now();
  if(found)lastSeen=now;
  const on=now-lastSeen<1500;
  if(on&&!playing){a.play().catch(()=>{});playing=true}
  if(!on&&playing){a.pause();a.currentTime=0;playing=false}
  box.classList.toggle('on',on);

  setTimeout(tick,200);
}
